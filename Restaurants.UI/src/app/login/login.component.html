<div class="dropdown-menu show">
  <form class="px-4 py-3" (ngSubmit)="login()">
    <div class="form-group">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" name="email" [(ngModel)]="credentials.email" placeholder="email@example.com" required>
    </div>
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" [(ngModel)]="credentials.password" placeholder="Password" required>
    </div>
    <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
</div>
